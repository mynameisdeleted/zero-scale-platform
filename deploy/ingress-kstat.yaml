apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zero-scale-kstat
  namespace: default
  labels:
    app: zero-scale-gateway
    app.kubernetes.io/name: zero-scale-kstat
    app.kubernetes.io/part-of: zero-scale-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  ingressClassName: public
  rules:
  - host: kstat.fairfaxmedia.net
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: zero-scale-gateway
            port:
              number: 80
  - host: kstat.kube.fairfaxmedia.net
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: zero-scale-gateway
            port:
              number: 80
