apiVersion: v1
kind: ServiceAccount
metadata:
  name: zero-scale-gateway
  labels:
    app.kubernetes.io/name: zero-scale-gateway
    app.kubernetes.io/part-of: zero-scale-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zero-scale-gateway-role
  labels:
    app.kubernetes.io/name: zero-scale-gateway
    app.kubernetes.io/part-of: zero-scale-platform
rules:
  # Allows reading app configurations (zero-scale-app-*) and database credentials
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zero-scale-gateway-binding
  labels:
    app.kubernetes.io/name: zero-scale-gateway
    app.kubernetes.io/part-of: zero-scale-platform
subjects:
  - kind: ServiceAccount
    name: zero-scale-gateway
    namespace: default
roleRef:
  kind: Role
  name: zero-scale-gateway-role
  apiGroup: rbac.authorization.k8s.io
