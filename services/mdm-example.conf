hostname: mdm.ffxm.cc
binary_path: ./mdm-controller
dynamic_user: false
idle_timeout: 60s

gateway:
  oauth_setup: mdm
  oauth_url: https://git.fairfaxmedia.net
  oauth_group: open-cream-cheese,mdm

secrets:
  - FLEET_SERVER_PRIVATE_KEY: fdm.FLEET_SERVER_PRIVATE_KEY
  - FLEET_MYSQL_ADDRESS: fdm.FLEET_MYSQL_ADDRESS
  - FLEET_MYSQL_DATABASE: fdm.FLEET_MYSQL_DATABASE
  - FLEET_MYSQL_USERNAME: fdm.FLEET_MYSQL_USERNAME
  - FLEET_MYSQL_PASSWORD: fdm.FLEET_MYSQL_PASSWORD

